<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WikiRealms OG card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #05070d;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(ellipse 70% 55% at 72% 42%, rgba(52, 89, 124, 0.28), transparent 62%),
          radial-gradient(ellipse 45% 40% at 18% 70%, rgba(116, 214, 232, 0.07), transparent 55%),
          linear-gradient(160deg, #0d1120 0%, #05070d 48%, #05070d 100%);
        color: #e9edf3;
        font-family: 'Space Grotesk', sans-serif;
        isolation: isolate;
      }

      /* Soft starfield */
      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1.5px 1.5px at 120px 90px, rgba(233, 237, 243, 0.55) 50%, transparent 51%),
          radial-gradient(1px 1px at 280px 160px, rgba(233, 237, 243, 0.35) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 980px 110px, rgba(233, 237, 243, 0.5) 50%, transparent 51%),
          radial-gradient(1px 1px at 1080px 220px, rgba(233, 237, 243, 0.3) 50%, transparent 51%),
          radial-gradient(1px 1px at 860px 480px, rgba(233, 237, 243, 0.4) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 420px 520px, rgba(233, 237, 243, 0.35) 50%, transparent 51%),
          radial-gradient(1px 1px at 640px 80px, rgba(233, 237, 243, 0.25) 50%, transparent 51%),
          radial-gradient(1px 1px at 200px 400px, rgba(233, 237, 243, 0.28) 50%, transparent 51%),
          radial-gradient(1px 1px at 750px 560px, rgba(116, 214, 232, 0.45) 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 1040px 520px, rgba(224, 184, 120, 0.35) 50%, transparent 51%);
      }

      /* Static globe — a frozen planet view, right of the wordmark */
      .planet {
        position: absolute;
        right: 36px;
        top: 50%;
        transform: translateY(-52%);
        width: 460px;
        height: 460px;
        pointer-events: none;
      }
      .planet__glow {
        position: absolute;
        inset: -8%;
        border-radius: 50%;
        background: radial-gradient(
          circle at 42% 38%,
          rgba(116, 214, 232, 0.16),
          rgba(52, 89, 124, 0.1) 42%,
          transparent 68%
        );
      }
      .planet__svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Instrument chrome frame */
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(163, 184, 205, 0.22);
        border-radius: 2px;
        pointer-events: none;
      }
      .frame::before,
      .frame::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: rgba(116, 214, 232, 0.55);
        border-style: solid;
      }
      .frame::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }
      .frame::after {
        bottom: -1px;
        right: -1px;
        border-width: 0 2px 2px 0;
      }
      .tick {
        position: absolute;
        background: rgba(163, 184, 205, 0.35);
      }
      .tick--tl {
        top: 28px;
        left: 56px;
        width: 24px;
        height: 1px;
      }
      .tick--tr {
        top: 28px;
        right: 56px;
        width: 24px;
        height: 1px;
      }
      .tick--bl {
        bottom: 28px;
        left: 56px;
        width: 24px;
        height: 1px;
      }
      .tick--br {
        bottom: 28px;
        right: 56px;
        width: 24px;
        height: 1px;
      }

      .readout {
        position: absolute;
        top: 48px;
        left: 56px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6c7b8e;
      }
      .readout span {
        color: #74d6e8;
      }

      .content {
        position: absolute;
        left: 56px;
        right: 56px;
        top: 50%;
        transform: translateY(-46%);
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 620px;
      }

      .identity {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .mark {
        width: 72px;
        height: 72px;
        color: #74d6e8;
        flex-shrink: 0;
        filter: drop-shadow(0 0 18px rgba(116, 214, 232, 0.35));
      }

      .wordmark {
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #e9edf3;
      }

      .pitch {
        font-size: 28px;
        font-weight: 500;
        line-height: 1.35;
        letter-spacing: -0.01em;
        color: #a3b1c2;
        max-width: 28ch;
      }

      .footer {
        position: absolute;
        bottom: 48px;
        left: 56px;
        right: 56px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #6c7b8e;
      }
      .footer strong {
        color: #e0b878;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="stars" aria-hidden="true"></div>
      <div class="planet" aria-hidden="true">
        <div class="planet__glow"></div>
        <svg class="planet__svg" viewBox="0 0 460 460" fill="none">
          <defs>
            <radialGradient id="ocean" cx="38%" cy="36%" r="62%">
              <stop offset="0%" stop-color="#3a6d8c" />
              <stop offset="55%" stop-color="#1e3f5a" />
              <stop offset="100%" stop-color="#0f2438" />
            </radialGradient>
            <radialGradient id="shade" cx="28%" cy="30%" r="78%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
              <stop offset="42%" stop-color="#ffffff" stop-opacity="0" />
              <stop offset="72%" stop-color="#05070d" stop-opacity="0.15" />
              <stop offset="100%" stop-color="#05070d" stop-opacity="0.72" />
            </radialGradient>
            <radialGradient id="atmos" cx="50%" cy="50%" r="50%">
              <stop offset="78%" stop-color="#74d6e8" stop-opacity="0" />
              <stop offset="92%" stop-color="#74d6e8" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#34597c" stop-opacity="0" />
            </radialGradient>
            <clipPath id="disc">
              <circle cx="230" cy="230" r="168" />
            </clipPath>
            <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="1.2" />
            </filter>
          </defs>

          <!-- Atmosphere halo -->
          <circle cx="230" cy="230" r="188" fill="url(#atmos)" />
          <circle cx="230" cy="230" r="172" stroke="rgba(116,214,232,0.28)" stroke-width="1.25" />

          <g clip-path="url(#disc)">
            <circle cx="230" cy="230" r="168" fill="url(#ocean)" />

            <!-- Continents / ranges — stylized terrain bands -->
            <path
              d="M78 210 C110 150, 150 130, 195 145 C240 160, 255 200, 300 195 C345 190, 370 150, 400 165
                 L410 210 C380 195, 350 230, 310 245 C265 262, 240 300, 195 290 C150 280, 120 250, 90 255 Z"
              fill="#4f7a45"
              opacity="0.92"
            />
            <path
              d="M95 250 C130 235, 160 255, 195 268 C235 282, 270 270, 305 278 C340 286, 365 310, 390 300
                 L385 340 C350 355, 310 335, 270 342 C225 350, 185 375, 145 360 C115 348, 100 310, 95 250 Z"
              fill="#3f6b3a"
              opacity="0.95"
            />
            <path
              d="M160 155 C185 130, 220 125, 250 145 C275 160, 285 185, 310 175
                 C295 205, 260 215, 230 200 C200 185, 175 190, 160 155 Z"
              fill="#6a9455"
              opacity="0.9"
            />
            <!-- Highland rock -->
            <path
              d="M200 165 C220 150, 245 155, 260 175 C248 190, 225 195, 205 185 Z"
              fill="#8a8f8a"
              opacity="0.55"
            />
            <path
              d="M250 285 C275 275, 300 285, 315 305 C295 318, 265 315, 250 285 Z"
              fill="#7d8278"
              opacity="0.45"
            />
            <!-- Snow caps -->
            <path
              d="M175 120 C200 95, 240 90, 270 110 C255 130, 225 135, 195 128 Z"
              fill="#e8eef5"
              opacity="0.88"
            />
            <path
              d="M300 140 C320 125, 345 130, 360 150 C340 165, 315 162, 300 140 Z"
              fill="#dfe6ef"
              opacity="0.7"
            />
            <!-- Inland water -->
            <ellipse cx="215" cy="235" rx="28" ry="14" fill="#2a5a78" opacity="0.75" transform="rotate(-18 215 235)" />
            <ellipse cx="290" cy="255" rx="18" ry="9" fill="#2a5a78" opacity="0.55" transform="rotate(12 290 255)" />

            <!-- Latitude / instrument ticks on the lit face -->
            <g stroke="rgba(233,237,243,0.1)" stroke-width="1" fill="none">
              <ellipse cx="230" cy="230" rx="160" ry="42" />
              <ellipse cx="230" cy="230" rx="145" ry="95" />
              <ellipse cx="230" cy="230" rx="95" ry="145" />
              <path d="M230 62 V398" />
              <path d="M70 230 H390" />
            </g>

            <!-- Portal markers -->
            <g filter="url(#soft)">
              <circle cx="188" cy="198" r="4.5" fill="#74d6e8" />
              <circle cx="268" cy="248" r="3.5" fill="#74d6e8" opacity="0.9" />
              <circle cx="312" cy="190" r="3" fill="#e0b878" />
            </g>
            <circle cx="188" cy="198" r="9" stroke="#74d6e8" stroke-opacity="0.35" stroke-width="1" />
            <circle cx="268" cy="248" r="7" stroke="#74d6e8" stroke-opacity="0.28" stroke-width="1" />

            <!-- Terminator / limb shade -->
            <circle cx="230" cy="230" r="168" fill="url(#shade)" />
          </g>

          <!-- Crisp limb -->
          <circle cx="230" cy="230" r="168" stroke="rgba(163,184,205,0.35)" stroke-width="1.5" />
          <!-- Specular rim hint -->
          <path
            d="M110 145 C145 95, 210 75, 275 95"
            stroke="rgba(233,237,243,0.35)"
            stroke-width="2"
            stroke-linecap="round"
            opacity="0.7"
          />
        </svg>
      </div>
      <div class="frame" aria-hidden="true"></div>
      <div class="tick tick--tl" aria-hidden="true"></div>
      <div class="tick tick--tr" aria-hidden="true"></div>
      <div class="tick tick--bl" aria-hidden="true"></div>
      <div class="tick tick--br" aria-hidden="true"></div>

      <p class="readout">Expedition <span>//</span> explore knowledge as landscape</p>

      <div class="content">
        <div class="identity">
          <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.5L20 12l-8 9.5L4 12z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="2.6" fill="currentColor" />
          </svg>
          <h1 class="wordmark">WikiRealms</h1>
        </div>
        <p class="pitch">Every Wikipedia article is a world.</p>
      </div>

      <p class="footer">
        <span>sections → ranges · links → portals</span>
        <span><strong>trail</strong> preserved</span>
      </p>
    </div>
  </body>
</html>
