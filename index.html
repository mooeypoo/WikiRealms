<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the stage reaches under the notch and the home
         indicator; the chrome pads itself back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta
      name="description"
      content="Every Wikipedia article is a world. Its sections become mountain ranges, its references grow the forests, and its links are portals out."
    />
    <meta name="application-name" content="WikiRealms" />
    <link rel="canonical" href="__SITE_ORIGIN__/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WikiRealms" />
    <meta property="og:title" content="WikiRealms" />
    <meta
      property="og:description"
      content="Every Wikipedia article is a world. Explore knowledge as a landscape."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:image" content="__SITE_ORIGIN__/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WikiRealms — Every Wikipedia article is a world." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WikiRealms" />
    <meta
      name="twitter:description"
      content="Every Wikipedia article is a world. Explore knowledge as a landscape."
    />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og.png" />
    <meta name="twitter:image:alt" content="WikiRealms — Every Wikipedia article is a world." />

    <title>WikiRealms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
