<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #05070d; }
    a { color: #74d6e8; text-decoration: none; }
    a:hover { color: #9ae6f4; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #05070d; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; color: #e9edf3;">

  <!-- STAGE :: starfield -->
  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 390px; height: 844px;">
    <g fill="#ffffff">
      <circle cx="42" cy="146" r="1.1" opacity=".5"/><circle cx="128" cy="98" r="0.8" opacity=".35"/>
      <circle cx="322" cy="132" r="1.2" opacity=".5"/><circle cx="358" cy="228" r="0.9" opacity=".35"/>
      <circle cx="30" cy="286" r="1" opacity=".4"/><circle cx="366" cy="352" r="1.1" opacity=".45"/>
      <circle cx="58" cy="604" r="1.2" opacity=".5"/><circle cx="336" cy="618" r="0.9" opacity=".35"/>
      <circle cx="196" cy="122" r="0.8" opacity=".3"/><circle cx="240" cy="656" r="1" opacity=".4"/>
      <circle cx="96" cy="662" r="0.8" opacity=".3"/>
    </g>
    <g fill="#e0b878">
      <circle cx="348" cy="470" r="1.1" opacity=".45"/><circle cx="34" cy="418" r="1" opacity=".38"/>
    </g>
  </svg>

  <!-- STAGE :: the world -->
  <div style="position: absolute; left: 30px; top: 232px; width: 330px; height: 330px;">
    <svg viewBox="0 0 400 400" width="330" height="330" style="display: block; overflow: visible;">
      <defs>
        <radialGradient id="p-ocean" cx="34%" cy="27%" r="80%">
          <stop offset="0%" stop-color="#2c7cc9"/>
          <stop offset="46%" stop-color="#17539f"/>
          <stop offset="100%" stop-color="#081f48"/>
        </radialGradient>
        <radialGradient id="p-limb" cx="34%" cy="27%" r="74%">
          <stop offset="52%" stop-color="#03050a" stop-opacity="0"/>
          <stop offset="86%" stop-color="#03050a" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#020307" stop-opacity=".92"/>
        </radialGradient>
        <radialGradient id="p-atmo" cx="50%" cy="50%" r="50%">
          <stop offset="70%" stop-color="#74d6e8" stop-opacity="0"/>
          <stop offset="90%" stop-color="#74d6e8" stop-opacity=".15"/>
          <stop offset="100%" stop-color="#74d6e8" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="p-globe"><circle cx="200" cy="200" r="150"/></clipPath>
      </defs>

      <circle cx="200" cy="200" r="196" fill="url(#p-atmo)"/>
      <circle cx="200" cy="200" r="150" fill="url(#p-ocean)"/>

      <g clip-path="url(#p-globe)">
        <path d="M 108 168 C 122 138 156 124 186 132 C 214 140 232 128 250 142 C 268 156 262 182 244 196 C 226 210 214 236 188 240 C 160 244 132 232 118 210 C 106 192 98 182 108 168 Z"
              fill="#609e4a" stroke="#d6c291" stroke-width="2.5" stroke-opacity=".45"/>
        <path d="M 138 172 C 152 156 178 152 196 162 C 212 172 208 190 194 200 C 176 212 150 208 140 194 C 132 184 130 180 138 172 Z"
              fill="#3c6e3c" opacity=".85"/>
        <path d="M 140 202 L 152 176 L 163 191 L 177 160 L 191 185 L 203 167 L 215 193 L 227 178"
              fill="none" stroke="#7a7166" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>
        <path d="M 140 202 L 152 176 L 163 191 L 177 160 L 191 185 L 203 167 L 215 193 L 227 178"
              fill="none" stroke="#f0f2f7" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".5"/>
        <path d="M 236 250 C 258 240 286 248 300 264 C 314 280 306 302 288 310 C 268 318 246 310 238 294 C 230 280 226 258 236 250 Z"
              fill="#3c6e3c" stroke="#d6c291" stroke-width="2.5" stroke-opacity=".4"/>
        <path d="M 252 266 L 262 252 L 271 264 L 281 250 L 290 268"
              fill="none" stroke="#7a7166" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
        <path d="M 92 246 C 104 236 122 240 128 252 C 134 264 124 276 110 274 C 96 272 86 258 92 246 Z"
              fill="#8caa5a" stroke="#d6c291" stroke-width="2" stroke-opacity=".4"/>
        <path d="M 128 76 C 160 60 242 60 274 78 C 250 96 150 96 128 76 Z" fill="#f0f2f7" opacity=".82"/>
        <path d="M 130 324 C 158 340 244 340 272 322 C 246 306 154 306 130 324 Z" fill="#f0f2f7" opacity=".74"/>

        <g transform="rotate(-11 200 200)" fill="none" stroke="#bfd6e6" stroke-opacity=".15" stroke-width=".9">
          <ellipse cx="200" cy="200" rx="150" ry="27"/>
          <ellipse cx="200" cy="128" rx="130" ry="23"/>
          <ellipse cx="200" cy="272" rx="130" ry="23"/>
          <ellipse cx="200" cy="200" rx="40" ry="150"/>
          <ellipse cx="200" cy="200" rx="86" ry="150"/>
          <ellipse cx="200" cy="200" rx="125" ry="150"/>
        </g>

        <g fill="none" stroke="#cfe0ec" stroke-opacity=".38" stroke-width="1.2" stroke-dasharray="3.5 4.5">
          <ellipse cx="180" cy="186" rx="66" ry="30" transform="rotate(-14 180 186)"/>
          <ellipse cx="270" cy="278" rx="42" ry="22" transform="rotate(12 270 278)"/>
        </g>

        <g transform="translate(228 148)">
          <circle r="11" fill="#74d6e8" fill-opacity=".14"/>
          <circle r="5.4" fill="none" stroke="#74d6e8" stroke-width="1.4"/>
          <circle r="1.8" fill="#74d6e8"/>
        </g>
        <g transform="translate(146 226)">
          <circle r="11" fill="#74d6e8" fill-opacity=".14"/>
          <circle r="5.4" fill="none" stroke="#74d6e8" stroke-width="1.4"/>
          <circle r="1.8" fill="#74d6e8"/>
        </g>
        <g transform="translate(286 292)">
          <circle r="11" fill="#74d6e8" fill-opacity=".14"/>
          <circle r="5.4" fill="none" stroke="#74d6e8" stroke-width="1.4"/>
          <circle r="1.8" fill="#74d6e8"/>
        </g>
      </g>

      <circle cx="200" cy="200" r="150" fill="url(#p-limb)"/>
      <circle cx="200" cy="200" r="150" fill="none" stroke="#74d6e8" stroke-opacity=".3" stroke-width="1.2"/>
    </svg>
  </div>

  <!-- INSTRUMENTS :: top scrim (content sits below the OS status bar via safe-area inset) -->
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 106px; padding: 48px 12px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: linear-gradient(180deg, rgba(5,7,13,.95) 0%, rgba(5,7,13,.68) 62%, rgba(5,7,13,0) 100%);">
    <div style="display: flex; align-items: center; gap: 9px; min-width: 0; flex-grow: 1;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#74d6e8" stroke-width="1.4" style="flex-shrink: 0;">
        <path d="M12 2.5 L20 12 L12 21.5 L4 12 Z"/><circle cx="12" cy="12" r="2.6" fill="#74d6e8" stroke="none"/>
      </svg>
      <span style="font-size: 14.5px; font-weight: 500; color: #e9edf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Cassini Division</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6c7b8e" stroke-width="1.8" style="flex-shrink: 0;"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
      <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid rgba(163,184,205,.16); border-radius: 8px; background: rgba(9,12,18,.72); color: #a3b1c2;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid rgba(163,184,205,.16); border-radius: 8px; background: rgba(9,12,18,.72); color: #a3b1c2;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
      </button>
    </div>
  </div>

  <!-- HELM :: floats above the sheet, thumb zone -->
  <div style="position: absolute; right: 12px; bottom: 168px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
    <button style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid rgba(163,184,205,.16); border-radius: 10px; background: rgba(9,12,18,.9); backdrop-filter: blur(14px); color: #a3b1c2; box-shadow: 0 10px 28px rgba(0,0,0,.5);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>
    </button>
    <div style="display: flex; gap: 3px; padding: 3px; border: 1px solid rgba(163,184,205,.16); border-radius: 11px; background: rgba(9,12,18,.9); backdrop-filter: blur(14px); box-shadow: 0 10px 28px rgba(0,0,0,.5);">
      <button style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid rgba(116,214,232,.55); border-radius: 8px; background: rgba(116,214,232,.14); color: #cff2fa;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5a13 13 0 0 1 0 17"/><path d="M12 3.5a13 13 0 0 0 0 17"/></svg>
      </button>
      <button style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid transparent; border-radius: 8px; background: none; color: #8fa2b5;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 6.5l6-2 6 2 6-2v13l-6 2-6-2-6 2z"/><path d="M9 4.5v13"/><path d="M15 6.5v13"/></svg>
      </button>
    </div>
  </div>

  <!-- LEDGER :: peek (bottom sheet, 3 snap points) -->
  <section style="position: absolute; left: 0; right: 0; bottom: 0; height: 144px; box-sizing: border-box; padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(163,184,205,.18); border-radius: 16px 16px 0 0; background: rgba(9,12,18,.94); backdrop-filter: blur(16px); box-shadow: 0 -14px 40px rgba(0,0,0,.55);">

    <span style="width: 38px; height: 4px; border-radius: 2px; background: rgba(163,184,205,.3); align-self: center;"></span>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <h2 style="margin: 0; font-size: 16px; font-weight: 500; color: #e9edf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Cassini Division</h2>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; letter-spacing: .14em; color: #6c7b8e;">PEEK · DRAG TO OPEN</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
        <span style="display: flex; align-items: flex-end; gap: 2px;">
          <span style="width: 3px; height: 5px; background: #74d6e8;"></span>
          <span style="width: 3px; height: 9px; background: rgba(163,184,205,.28);"></span>
          <span style="width: 3px; height: 13px; background: rgba(163,184,205,.28);"></span>
        </span>
        <button style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid rgba(163,184,205,.16); border-radius: 8px; background: rgba(163,184,205,.05); color: #a3b1c2;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 15l6-6 6 6"/></svg>
        </button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-top: 9px; border-top: 1px solid rgba(163,184,205,.14);">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 7.5px; letter-spacing: .13em; color: #6c7b8e;">SECT</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #e9edf3; font-variant-numeric: tabular-nums;">7</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 7.5px; letter-spacing: .13em; color: #6c7b8e;">CITE</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #e9edf3; font-variant-numeric: tabular-nums;">24</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 7.5px; letter-spacing: .13em; color: #6c7b8e;">PORT</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #74d6e8; font-variant-numeric: tabular-nums;">12</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 7.5px; letter-spacing: .13em; color: #6c7b8e;">SEA</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #e9edf3; font-variant-numeric: tabular-nums;">0.42</span>
      </div>
    </div>
  </section>

</div>
</x-dc>
</body>
</html>
